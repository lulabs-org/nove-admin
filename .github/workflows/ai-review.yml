name: AI Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ai-review:
    if: github.event.issue.pull_request != '' && contains(github.event.comment.body, '@review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AI Review
        uses: actions/github-script@v7
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        with:
          script: |
            // ===== 0. fork PR / 未配置 secret 兜底 =====
            if (!process.env.OPENAI_API_KEY || !process.env.OPENAI_BASE_URL || !process.env.OPENAI_MODEL) {
              core.info('未配置 OPENAI_* secrets（可能为 fork PR），跳过 AI Review');
              return;
            }

            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const prNumber = context.issue.number;
            const comment  = context.payload.comment;
            const model    = process.env.OPENAI_MODEL;

            core.info(`AI Review 开始 · PR #${prNumber} · 模型 ${model}`);

            // ===== 1. 权限校验 =====
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (comment.user.login !== pr.user.login && !allowed.includes(comment.author_association)) {
              core.info(`无权限触发 AI Review（@${comment.user.login}, ${comment.author_association}），跳过`);
              return;
            }

            // ===== 2. 拉取变更文件并过滤 =====
            const files = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: prNumber, per_page: 100, page,
              });
              files.push(...data);
              if (data.length < 100) break;
            }

            const ignorePatterns = [
              /pnpm-lock\.yaml$/, /package-lock\.json$/, /yarn\.lock$/,
              /\.map$/, /dist\//, /build\//,
              /docs\//, /\.md$/, /CHANGELOG/, /LICENSE/,
            ];
            const reviewable = files.filter(f =>
              f.status !== 'removed' &&
              !ignorePatterns.some(p => p.test(f.filename)) &&
              (f.patch?.length ?? 0) > 0 &&
              (f.patch?.length ?? 0) < 50000
            );

            if (reviewable.length === 0) {
              core.info('没有可审查的文件（全部被过滤或为删除项），跳过');
              await github.rest.pulls.createReview({
                owner, repo, pull_number: prNumber, event: 'COMMENT',
                body: [
                  '## 🤖 AI Code Review',
                  '',
                  '本次变更无可审查的代码文件（lock / 生成产物 / 文档 / 删除项 已自动跳过）。',
                  '',
                  runFooter(),
                ].join('\n'),
              });
              return;
            }

            // ===== 3. 第一步：探索 prompt（找出疑似问题 + 需要的上下文文件）=====
            const explorePrompt = [
              '你是资深 React / TypeScript 代码审查专家。审查以下 PR 的 diff，找出疑似问题。',
              '',
              '技术栈：React 19、Ant Design 6、TanStack Query、Zustand、React Hook Form、Zod、Vite、Orval。',
              '',
              '审查原则：',
              '- 只关注有实际影响的问题：bug、安全风险、数据丢失、内存泄漏、性能反模式、类型安全漏洞。',
              '- 不要报告纯风格/格式问题（缩进、引号、命名、注释缺失、import 顺序）——这些由 ESLint/Prettier 处理。',
              '- 只审查 diff 中变更的代码行，不要报告未修改行的问题。',
              '- 不确定是否是问题时，标记为疑似并通过 context_files 指出需要查看哪些文件来确认。',
              '- 不要误报合理的工程决策：受控的 any（如第三方库边界）、有意的类型断言、必要的 escape hatch。',
              '',
              '重点检查：',
              '1. React：hooks 依赖数组遗漏/多余、useEffect 未清理（定时器/监听/订阅）、setState 闭包陷阱、列表 key、不必要的 re-render',
              '2. TanStack Query：queryKey 是否能正确缓存/失效、mutation 后 invalidate 是否覆盖、staleTime/gcTime 配置',
              '3. Zustand：selector 粒度（避免全量订阅导致 re-render）、store 中混入派生数据',
              '4. 类型安全：unsafe 类型断言（as unknown as）、隐式 any、Zod schema 与 TS 类型不一致、可选链缺失',
              '5. 安全：硬编码密钥/token、XSS（dangerouslySetInnerHTML 未转义）、未校验的用户输入',
              '',
              '安全约束：',
              '- 发现疑似硬编码密钥/token/凭证，直接报告（context_files 可为空数组），值做部分遮蔽展示（如 sk-***xxxx）。',
              '- 不要输出任何密钥、token、凭证。',
              '',
              '本次任务（探索阶段）：找出疑似问题，并指出需要查看哪些上下文文件才能确认。',
              '对于每个疑似问题，列出需要查看的文件路径（仓库相对路径，如 src/hooks/useXxx.ts、src/types/xxx.ts）。',
              '优先列出：被调用函数/hook 的定义文件、类型定义文件、相关接口/schema 文件、调用方文件。',
              '确信无疑的问题（如硬编码密钥）context_files 可为空数组。',
              '',
              '输出严格 JSON（仅 JSON，不要 markdown 代码块包裹，不要前后解释文字）：',
              '{',
              '  "suspects": [',
              '    { "file": "src/features/auth/api/api.ts",',
              '      "line": 42,',
              '      "title": "一句话疑似问题（不要带 emoji）",',
              '      "why_suspect": "基于 diff 看到什么而怀疑",',
              '      "context_files": ["src/hooks/useAuth.ts", "src/features/auth/model/types.ts"] }',
              '  ]',
              '}',
              '没有疑似问题时 suspects 返回空数组。不要编造问题。',
            ].join('\n');

            const fileBlocks = reviewable.map(f => `### ${f.filename}\n\`\`\`diff\n${f.patch}\n\`\`\``);

            // 分块：单块 user content 上限 ~80KB，避免超出模型上下文
            const MAX_CHUNK_BYTES = 80000;
            function chunkBlocks(blocks) {
              const chunks = [];
              let cur = [];
              let curLen = 0;
              for (const b of blocks) {
                const len = Buffer.byteLength(b, 'utf8');
                if (curLen + len > MAX_CHUNK_BYTES && cur.length > 0) {
                  chunks.push(cur);
                  cur = [];
                  curLen = 0;
                }
                cur.push(b);
                curLen += len;
              }
              if (cur.length > 0) chunks.push(cur);
              return chunks;
            }
            const chunks = chunkBlocks(fileBlocks);
            core.info(`审查文件 ${reviewable.length} 个，分 ${chunks.length} 块调用模型`);

            // ===== 4. 调用 DeepSeek（每块一次，结果合并） =====
            function parseJsonContent(text) {
              if (!text) return null;
              let t = text.trim();
              // 去除可能的 ```json ... ``` 包裹
              const fence = t.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
              if (fence) t = fence[1].trim();
              try { return JSON.parse(t); } catch (_) { /* fallthrough */ }
              // 尝试截取第一个 { 到最后一个 }
              const first = t.indexOf('{');
              const last  = t.lastIndexOf('}');
              if (first !== -1 && last !== -1 && last > first) {
                try { return JSON.parse(t.slice(first, last + 1)); } catch (_) { /* ignore */ }
              }
              return null;
            }

            async function callModel(sysPrompt, userContent, maxTokens) {
              const body = {
                model,
                temperature: 0.2,
                max_tokens: maxTokens,
                messages: [
                  { role: 'system', content: sysPrompt },
                  { role: 'user',   content: userContent },
                ],
              };
              // DeepSeek V4 默认开启 thinking 模式（产生额外 reasoning token，按输出计费、增加延迟）
              // 代码审查场景关闭 thinking 以对等旧 deepseek-chat 行为，保持低成本快速响应
              // 仅对 deepseek 系列模型注入该参数，换用其他 OpenAI 兼容 API 时不受影响
              if (/deepseek/i.test(model)) {
                body.thinking = { type: 'disabled' };
              }
              const resp = await fetch(`${process.env.OPENAI_BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,
                },
                body: JSON.stringify(body),
              });
              if (!resp.ok) {
                const statusText = await resp.text().catch(() => '');
                // 仅打印 status 与截断后的安全片段，绝不打印请求头
                core.warning(`模型返回非 2xx: ${resp.status} ${resp.statusText}`);
                if (statusText) core.warning(`响应片段: ${statusText.slice(0, 200)}`);
                throw new Error(`API 调用失败: ${resp.status} ${resp.statusText}`);
              }
              const data = await resp.json();
              return data.choices?.[0]?.message?.content ?? '';
            }

            // PR 描述（方案 2：让模型理解变更意图，避免误报合理决策）
            const prDescription = (pr.body && pr.body.trim()) ? pr.body.trim() : '（无 PR 描述）';

            // ===== 4a. 第一步：探索（分块调用，找出疑似问题 + 需要的上下文文件）=====
            const allSuspects = [];
            for (let i = 0; i < chunks.length; i++) {
              const userContent = [
                `## PR 描述\n${prDescription}`,
                '',
                `## 变更 diff（第 ${i + 1}/${chunks.length} 块）`,
                '',
                chunks[i].join('\n\n'),
              ].join('\n');
              core.info(`探索 · 块 ${i + 1}/${chunks.length}`);
              const content = await callModel(explorePrompt, userContent, 3000);
              const parsed = parseJsonContent(content);
              if (parsed && Array.isArray(parsed.suspects)) {
                allSuspects.push(...parsed.suspects);
              } else {
                core.warning(`块 ${i + 1} 探索结果解析失败，跳过`);
              }
            }

            // suspects 去重（按 file + title）
            const seenSuspect = new Set();
            const suspects = allSuspects.filter(s => {
              const key = `${(s?.file || '').toLowerCase()}|${(s?.title || '').toLowerCase()}`;
              if (seenSuspect.has(key)) return false;
              seenSuspect.add(key);
              return true;
            });
            core.info(`探索完成 · ${suspects.length} 个疑似问题`);

            // ===== 4b. 拉取上下文文件（方案 4：模拟 IDE 探索-验证回路）=====
            const requestedFiles = new Set();
            for (const s of suspects) {
              for (const f of (s.context_files || [])) {
                if (typeof f === 'string' && f.trim()) requestedFiles.add(f.trim());
              }
            }
            const MAX_CONTEXT_FILES = 10;
            const MAX_FILE_BYTES = 20000;
            const filesToFetch = [...requestedFiles].slice(0, MAX_CONTEXT_FILES);
            if (requestedFiles.size > MAX_CONTEXT_FILES) {
              core.info(`上下文文件请求 ${requestedFiles.size} 个，截断为前 ${MAX_CONTEXT_FILES} 个`);
            }
            const contextContents = {};
            for (const filePath of filesToFetch) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: filePath, ref: pr.head.sha,
                });
                if (data.type === 'file' && data.content && data.encoding === 'base64') {
                  const text = Buffer.from(data.content, 'base64').toString('utf8');
                  contextContents[filePath] = text.length > MAX_FILE_BYTES
                    ? text.slice(0, MAX_FILE_BYTES) + '\n... (截断，文件过大)'
                    : text;
                  core.info(`拉取上下文 ${filePath} · ${text.length} 字符`);
                }
              } catch (e) {
                core.warning(`拉取 ${filePath} 失败: ${e.status || e.message}`);
              }
            }

            // ===== 4c. 第二步：验证（基于完整上下文确认/驳回每个疑似问题）=====
            let summary = '';
            let rawIssues = [];

            if (suspects.length === 0) {
              summary = '探索阶段未发现疑似问题。';
            } else {
              const verifyPrompt = [
                '你是资深 React / TypeScript 代码审查专家。基于完整上下文，确认或驳回以下疑似问题。',
                '',
                '技术栈：React 19、Ant Design 6、TanStack Query、Zustand、React Hook Form、Zod、Vite、Orval。',
                '',
                '验证原则：',
                '- 基于提供的上下文文件内容，判断每个疑似问题是否成立。',
                '- 驳回：上下文已处理的、误判的、合理的工程决策、基于 diff 外代码的误报。',
                '- 确认：上下文证实确实存在问题，或无法排除且风险足够大。',
                '- 只保留确认的问题。宁缺毋滥，没有确认的问题就返回空数组。',
                '- 不要报告纯风格/格式问题。',
                '',
                '安全约束：',
                '- 确认的硬编码密钥作为 critical，值做部分遮蔽展示（如 sk-***xxxx）。',
                '- 不要输出任何密钥、token、凭证。',
                '',
                'severity 定义：',
                '- critical：会导致 bug、安全问题、数据损失或崩溃',
                '- major：很可能引发问题，或显著降低代码质量/可维护性',
                '- minor：有实际意义的小改进（非风格类）',
                '- 没有 nit 级别。',
                '',
                '输出严格 JSON（仅 JSON，不要 markdown 代码块包裹，不要前后解释文字）：',
                '{',
                '  "summary": "2-3 句整体结论，点出主要风险点；无风险则说明结论",',
                '  "issues": [',
                '    { "severity": "critical|major|minor",',
                '      "file": "src/...",',
                '      "line": 42,',
                '      "title": "一句话问题（不要带 emoji）",',
                '      "description": "为什么是问题 + 具体影响（引用上下文证据）",',
                '      "suggestion": "建议改法" }',
                '  ]',
                '}',
                '没有确认的问题时 issues 返回空数组。',
              ].join('\n');

              const suspectsBlock = suspects.map((s, i) =>
                `### 疑似 ${i + 1}: ${s.title || ''}\n- 文件: ${s.file || '?'}${s.line ? ':' + s.line : ''}\n- 怀疑原因: ${s.why_suspect || ''}`
              ).join('\n\n');

              const contextBlock = Object.keys(contextContents).length > 0
                ? Object.entries(contextContents).map(([path, content]) =>
                    `### ${path}\n\`\`\`\n${content}\n\`\`\``
                  ).join('\n\n')
                : '（探索阶段未请求额外上下文文件，或拉取失败）';

              const verifyUserContent = [
                `## PR 描述\n${prDescription}`,
                '',
                `## 疑似问题清单（共 ${suspects.length} 个）`,
                suspectsBlock,
                '',
                '## 上下文文件',
                contextBlock,
              ].join('\n');

              core.info(`验证 · 调用模型确认 ${suspects.length} 个疑似问题`);
              const verifyContent = await callModel(verifyPrompt, verifyUserContent, 4000);
              const verified = parseJsonContent(verifyContent);
              if (verified) {
                summary = verified.summary || '';
                if (Array.isArray(verified.issues)) rawIssues = verified.issues;
              } else {
                core.warning('验证结果 JSON 解析失败');
                summary = '验证阶段结果解析失败，未输出问题。';
              }
            }

            // 按 file + title 去重（验证步可能对分批 suspects 产生重复）
            const seen = new Set();
            const issues = rawIssues.filter(item => {
              const key = `${(item?.file || '').toLowerCase()}|${(item?.title || '').toLowerCase()}`;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            });

            const merged = { summary };

            // ===== 5. 格式化 Markdown =====
            function runFooter() {
              return `\n---\n> 由 GitHub Actions run [#${context.runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) 生成 · 模型: ${model}`;
            }

            const SEVERITY_LABEL = {
              critical: '🔴 Critical',
              major:    '🟠 Major',
              minor:    '🟡 Minor',
            };
            const SEVERITY_ORDER = ['critical', 'major', 'minor'];

            function formatIssue(item, idx) {
              const file  = item.file ? `\`${item.file}\`` : '_未知文件_';
              const line  = item.line ? `:${item.line}` : '';
              const title = item.title ? `**${item.title}**` : '';
              const desc  = item.description ? `\n\n${item.description}` : '';
              const sug   = item.suggestion  ? `\n\n💡 建议：${item.suggestion}` : '';
              return `${idx + 1}. ${title} — ${file}${line}${desc}${sug}\n`;
            }

            let body = '## 🤖 AI Code Review\n\n';
            body += merged.summary
              ? `**整体结论**：${merged.summary}\n\n`
              : '本次未取得整体结论摘要。\n\n';

            if (issues.length === 0) {
              body += '✅ 未发现明显问题。\n';
            } else {
              // 顶部统计行：一眼看到严重问题分布
              const counts = {};
              for (const sev of SEVERITY_ORDER) {
                counts[sev] = issues.filter(x => (x.severity || '').toLowerCase() === sev).length;
              }
              const otherGroup = issues.filter(x => !SEVERITY_ORDER.includes((x.severity || '').toLowerCase()));
              const stats = SEVERITY_ORDER.filter(s => counts[s] > 0).map(s => `${SEVERITY_LABEL[s]} ×${counts[s]}`);
              if (otherGroup.length > 0) stats.push(`⚪ 其他 ×${otherGroup.length}`);
              body += `**问题统计**：${stats.join(' · ')}（共 ${issues.length} 个）\n`;

              // critical / major 完整展示（reviewer 必看）
              for (const sev of ['critical', 'major']) {
                const group = issues.filter(x => (x.severity || '').toLowerCase() === sev);
                if (group.length === 0) continue;
                body += `\n### ${SEVERITY_LABEL[sev]}（${group.length}）\n\n`;
                for (const [idx, item] of group.entries()) body += formatIssue(item, idx);
              }

              // minor 及其他默认折叠（信噪比优化：次要问题不抢注意力）
              const minorGroup = counts.minor > 0
                ? issues.filter(x => (x.severity || '').toLowerCase() === 'minor')
                : [];
              if (minorGroup.length > 0 || otherGroup.length > 0) {
                const total = minorGroup.length + otherGroup.length;
                body += `\n<details><summary>🟡 Minor 及其他（${total}，点击展开）</summary>\n\n`;
                for (const [idx, item] of minorGroup.entries()) body += formatIssue(item, idx);
                if (minorGroup.length > 0 && otherGroup.length > 0) body += '\n';
                for (const [idx, item] of otherGroup.entries()) body += formatIssue(item, idx);
                body += `\n</details>\n`;
              }
            }

            body += runFooter();

            // ===== 6. 发布 Review 评论 =====
            await github.rest.pulls.createReview({
              owner, repo, pull_number: prNumber,
              event: 'COMMENT',
              body,
            });
            core.info(`AI Review 完成 · 共 ${issues.length} 个问题`);
